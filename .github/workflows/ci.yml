# The gates live in maestrolabs-hq/.github so that one pinned SHA is not three.
# Only what genuinely differs stays here.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    uses: maestrolabs-hq/.github/.github/workflows/rust-ci.yml@main
    with:
      duplication-test: duplication
      node: true
