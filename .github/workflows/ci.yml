# The fast tier. Gates live in maestrolabs-hq/.github so one pinned SHA is not
# three; triggers, cadence, concurrency and permissions stay here, where a
# reader of this repository can see them.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    uses: maestrolabs-hq/.github/.github/workflows/rust-fast.yml@main
    with:
      duplication-test: duplication
      node: true
