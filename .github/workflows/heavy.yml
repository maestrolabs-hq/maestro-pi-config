# The heavy tier: evidence, not a gate. Never a required context -- blocking a
# merge on a long matrix is how a team learns to bypass its own checks.
# A result older than eight days is not evidence, which is what the weekly
# schedule is for; workflow_dispatch is how it gets proved before then.
name: Heavy

on:
  schedule:
    - cron: "0 6 * * 1"   # Monday 06:00 UTC, clear of the fleet audit at 07:00
  workflow_dispatch:

# A called workflow cannot exceed its caller's permissions, and Scorecard
# publishes a SARIF result. Granting it here rather than inside the reusable
# workflow keeps the ceiling visible from the repository it applies to.
permissions:
  contents: read
  security-events: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  heavy:
    uses: maestrolabs-hq/.github/.github/workflows/rust-heavy.yml@main
    with:
      msrv: "1.85"
