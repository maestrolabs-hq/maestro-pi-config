# Local hook configuration, run by prek (https://github.com/j178/prek).
# Enable with: prek install --install-hooks (done by `just setup`).
#
# Both hook types are declared here rather than passed as install flags, so the
# plain install command wires the merge gate too: a merge that commits on its
# own runs pre-merge-commit, not pre-commit, and would otherwise bring in
# changes no gate ever saw.
default_install_hook_types: [pre-commit, pre-merge-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-json
      - id: check-yaml
      # config/ holds captured configuration. It must stay byte-identical to
      # the files it was taken from: a hook that appends a newline makes every
      # sync report drift that no sync can ever resolve, and makes a restore
      # write something the machine did not have.
      - id: end-of-file-fixer
        exclude: ^config/
      - id: trailing-whitespace
        exclude: ^config/

  - repo: https://github.com/gitleaks/gitleaks
    # Same engine locally and in CI, so a commit blocked here is blocked there.
    # This repository holds pi configuration, which is exactly where a token
    # gets pasted by accident.
    rev: v8.24.3
    hooks:
      - id: gitleaks
        always_run: true

  - repo: local
    hooks:
      # always_run: without it the whole-project gates are skipped on commits
      # whose staged files match no filter, such as pure deletions.
      - id: cargo-fmt
        name: cargo fmt (check only)
        entry: cargo fmt --all --check
        language: system
        pass_filenames: false
        always_run: true
      - id: cargo-clippy
        name: cargo clippy (warnings are errors)
        entry: cargo clippy --all-targets --all-features -- -D warnings
        language: system
        pass_filenames: false
        always_run: true
      - id: cargo-test
        name: cargo test
        entry: cargo test
        language: system
        pass_filenames: false
        always_run: true
      - id: cargo-similarity
        name: similarity-rs (copy-paste, allowlisted)
        entry: cargo test --test duplication
        language: system
        pass_filenames: false
        always_run: true
      - id: cargo-machete
        name: cargo machete (unused dependencies)
        entry: cargo machete
        language: system
        pass_filenames: false
        always_run: true
      - id: cargo-deny
        name: cargo deny (advisories, licences, bans, sources)
        entry: cargo deny check
        language: system
        pass_filenames: false
        always_run: true
